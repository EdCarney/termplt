[package]
name = "termplt"
version = "0.2.0"
edition = "2024"
# let-chains need 1.88; checked by the MSRV job in CI
rust-version = "1.88"
description = "A Rust library for rendering 2D plots directly in Kitty-compatible terminals"
license = "MIT"
repository = "https://github.com/EdCarney/termplt"
keywords = ["terminal", "plotting", "kitty", "graphs", "cli"]
categories = ["command-line-utilities", "visualization"]
exclude = ["test_data/", "scripts/", ".claude/", ".github/", "CLAUDE.md", "IMPROVEMENTS.md"]

[[bin]]
name = "termplt"
path = "src/bin/termplt/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive", "string"], optional = true }
clap_complete = { version = "4", optional = true }
crossterm = "0.29.0"
image = { version = "0.25.6", default-features = false, features = ["png"] }
rgb = "0.8.50"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[features]
default = ["cli"]
# The command-line tool. Library users can disable it with `default-features = false` to avoid
# compiling its dependencies.
cli = ["dep:clap", "dep:clap_complete"]

# The end-to-end tests run the CLI binary, so they need the `cli` feature.
[[test]]
name = "pty"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]
