[package]
name = "termplt"
version = "0.1.2"
edition = "2024"
description = "A Rust library for rendering 2D plots directly in Kitty-compatible terminals"
license = "MIT"
repository = "https://github.com/EdCarney/termplt"
keywords = ["terminal", "plotting", "kitty", "graphs", "cli"]
categories = ["command-line-utilities", "visualization"]
exclude = ["test_data/", "scripts/", ".claude/", "CLAUDE.md"]

[[bin]]
name = "termplt"
path = "src/bin/termplt/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
crossterm = "0.29.0"
image = "0.25.6"
rgb = "0.8.50"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = ["cli"]
# The command-line tool. Library users can disable it with `default-features = false` to avoid
# compiling its dependencies.
cli = ["dep:clap"]
